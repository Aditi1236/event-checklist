<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Roster — the club event checklist platform by NexaSoul, Chandigarh University. Plan events, assign tasks to your committee and track progress live."
    />
    <meta property="og:title" content="Roster — Club Event Checklist" />
    <meta
      property="og:description"
      content="Plan every club event, assign every task, and watch progress climb live. Admin and member portals for organising committees."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Roster &mdash; Club Event Checklist | NexaSoul</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("roster.theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored ? stored === "dark" : prefersDark;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();

      function showFatal(msg) {
        var el = document.getElementById("fatal-error");
        if (!el) {
          el = document.createElement("pre");
          el.id = "fatal-error";
          el.style.cssText =
            "position:fixed;inset:0;z-index:99999;margin:0;padding:24px;background:#0b0c10;color:#fb7aaa;font:13px/1.5 monospace;white-space:pre-wrap;overflow:auto;";
          (document.body || document.documentElement).appendChild(el);
        }
        el.textContent += "\n" + msg;
      }
      window.addEventListener("error", function (e) {
        showFatal((e.error && e.error.stack) || e.message || String(e));
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e.reason;
        showFatal("Unhandled promise rejection:\n" + ((r && (r.stack || r.message)) || r));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
